name: Render ListStory

# Manual trigger only — this hits the Pexels API and does a full Remotion
# render. Run it from the Actions tab once you're happy with
# src/data/listStory.json.
on:
  workflow_dispatch:
    inputs:
      force_refetch:
        description: "Re-download the background clip even if already cached in a previous run's output"
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch background clip from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fetch-list-story-broll.mjs ${{ inputs.force_refetch && '--force' || '' }}

      - name: Render ListStory
        run: npx remotion render ListStory out/list-story.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: list-story
          path: out/list-story.mp4
          retention-days: 14
